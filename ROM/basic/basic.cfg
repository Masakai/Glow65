# ゼロページ(0-255)とページ1(256-511)は RAM。初期値も含めてイメージには出力しない。
# ROM(CODE)だけを basic.bin として出力する。
MEMORY {
    ZP:   start = $0000, size = $0100, type = rw, file = "";
    PAGE1: start = $0100, size = $0100, type = rw, file = "";
    ROM:  start = $C000, size = $3000, type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = rw;
    PAGE1:    load = PAGE1, type = rw;
    CODE:     load = ROM,   type = ro;
}
