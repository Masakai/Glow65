# iPad 版のプロジェクト。`xcodegen -s iOS/project.yml` で Glow65iPad.xcodeproj を作る(git 管理外)。
name: Glow65iPad
options:
  bundleIdPrefix: io.github.masakai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  Glow65Package:
    path: ..
targets:
  Glow65iPad:
    type: application
    platform: iOS
    sources:
      - path: Glow65iPadApp.swift
      - path: Assets.xcassets
      - path: ../Localization
      - path: ../Sources/Glow65App
        excludes:
          - Glow65App.swift   # macOS 専用(AppDelegate と @main)
    dependencies:
      - package: Glow65Package
        product: Glow65
      - package: Glow65Package
        product: Core6502
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Glow65
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ja
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.masakai.glow65
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Copy ROM and samples
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          ROOT="${SRCROOT}/.."
          DEST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}"
          mkdir -p "$DEST/ROM/basic/build" "$DEST/tutorial" "$DEST/examples"
          [ -f "$ROOT/ROM/monitor.bin" ] || "$ROOT/Tools/build_monitor.sh"
          [ -f "$ROOT/ROM/game65g.bin" ] || "$ROOT/Tools/build_game65g.sh"
          if [ ! -f "$ROOT/ROM/basic/build/basic.bin" ] && command -v ca65 >/dev/null 2>&1; then
              "$ROOT/Tools/build_basic.sh"
          fi
          cp "$ROOT/ROM/monitor.bin" "$ROOT/ROM/game65g.bin" "$DEST/ROM/"
          if [ -f "$ROOT/ROM/basic/build/basic.bin" ]; then
              cp "$ROOT/ROM/basic/build/basic.bin" "$DEST/ROM/basic/build/"
          else
              echo "warning: basic.bin がない(cc65 が必要)。BASIC なしで、モニタだけが動く"
          fi
          cp "$ROOT"/tutorial/*.bin "$DEST/tutorial/"
          cp "$ROOT"/examples/*.gam "$DEST/examples/"
