<svg xmlns="http://www.w3.org/2000/svg" width="720" height="694" viewBox="0 0 720 694" role="img" aria-labelledby="t d">
<title id="t">JSR と RTS</title>
<desc id="d">JSR が戻り番地(最後のバイトの番地)を積み、RTS が 1 を足して戻ること。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bc4c00"/></marker></defs>
<rect x="0.5" y="0.5" width="719" height="693" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="30" y="32" font-size="16" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">JSR と RTS</text>
<text x="690" y="32" font-size="16" font-weight="bold" text-anchor="end" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"></text>
<text x="62" y="60" font-size="11" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">オペコード</text>
<rect x="30" y="66" width="64" height="32" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
<text x="62" y="88" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">20</text>
<text x="162" y="60" font-size="11" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">オペランド(下位)</text>
<rect x="130" y="66" width="64" height="32" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="162" y="88" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">40</text>
<text x="262" y="60" font-size="11" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">オペランド(上位)</text>
<rect x="230" y="66" width="64" height="32" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="262" y="88" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">03</text>
<text x="62" y="114" font-size="11" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">$0300</text>
<text x="162" y="114" font-size="11" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">$0301</text>
<text x="262" y="114" font-size="11" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">$0302</text>
<rect x="470" y="133.0" width="110" height="34" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<text x="480" y="155.0" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">PC</text>
<text x="570" y="155.0" font-size="14" font-weight="bold" text-anchor="end" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$0340</text>
<path d="M 358 82 L 410 82 L 410 150 L 470 150" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<circle cx="410" cy="110" r="10" fill="#bc4c00"/>
<text x="410" y="114.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">4</text>
<rect x="30" y="173.0" width="110" height="34" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
<text x="40" y="195.0" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">PC</text>
<text x="130" y="195.0" font-size="14" font-weight="bold" text-anchor="end" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$0303</text>
<text x="30" y="221.0" font-size="11" font-weight="normal" text-anchor="start" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">3 バイト読み終えた位置</text>
<rect x="250" y="162" width="170" height="56" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="335.0" y="186.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PC − 1</text>
<text x="335.0" y="204.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">= $0302</text>
<path d="M 140 190 L 250 190" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="195" cy="190" r="10" fill="#0969da"/>
<text x="195" y="194.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">1</text>
<text x="555" y="214" font-size="11" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">スタック</text>
<rect x="470" y="226.0" width="72" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<rect x="542" y="226.0" width="60" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="506.0" y="245.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$01FD</text>
<text x="572.0" y="245.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$03</text>
<rect x="470" y="262.0" width="72" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<rect x="542" y="262.0" width="60" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="506.0" y="281.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$01FC</text>
<text x="572.0" y="281.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$02</text>
<rect x="470" y="298.0" width="72" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="542" y="298.0" width="60" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="506.0" y="317.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$01FB</text>
<text x="572.0" y="317.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">..</text>
<path d="M 420 176 L 445 176 L 445 240 L 470 240" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="432" cy="176" r="10" fill="#0969da"/>
<text x="432" y="180.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">2</text>
<path d="M 420 202 L 445 202 L 445 276 L 470 276" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="432" cy="202" r="10" fill="#0969da"/>
<text x="432" y="206.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">3</text>
<rect x="30" y="283.0" width="140" height="34" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<text x="40" y="305.0" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">SP</text>
<text x="160" y="305.0" font-size="14" font-weight="bold" text-anchor="end" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$FD → $FB</text>
<text x="30" y="350" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">① 3 バイトを読み終えた PC は $0303。</text>
<text x="30" y="372" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">② ③ PC から 1 を引いた $0302 を、上位($03)、下位($02)の順に積む。$0302 は、JSR の最後のバイトの番地。</text>
<text x="30" y="394" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">④ PC はオペランドの $0340 になる。SP は 2 減って $FB になる。</text>
<text x="30" y="478" font-size="16" font-weight="bold" text-anchor="start" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">RTS</text>
<text x="555" y="490" font-size="11" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">スタック</text>
<rect x="470" y="496.0" width="72" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<rect x="542" y="496.0" width="60" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="506.0" y="515.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$01FD</text>
<text x="572.0" y="515.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$03</text>
<rect x="470" y="532.0" width="72" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<rect x="542" y="532.0" width="60" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="506.0" y="551.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$01FC</text>
<text x="572.0" y="551.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$02</text>
<rect x="470" y="568.0" width="72" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="542" y="568.0" width="60" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="506.0" y="587.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$01FB</text>
<text x="572.0" y="587.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">..</text>
<rect x="30" y="529.0" width="140" height="34" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<text x="40" y="551.0" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">SP</text>
<text x="160" y="551.0" font-size="14" font-weight="bold" text-anchor="end" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$FB → $FD</text>
<rect x="250" y="518" width="170" height="56" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="335.0" y="542.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$0302 + 1</text>
<text x="335.0" y="560.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">= $0303</text>
<path d="M 470 546 L 445 546 L 445 560 L 420 560" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="458" cy="546" r="10" fill="#0969da"/>
<text x="458" y="550.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">1</text>
<path d="M 470 510 L 445 510 L 445 532 L 420 532" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="458" cy="510" r="10" fill="#0969da"/>
<text x="458" y="514.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">2</text>
<rect x="30" y="593.0" width="110" height="34" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<text x="40" y="615.0" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">PC</text>
<text x="130" y="615.0" font-size="14" font-weight="bold" text-anchor="end" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$0303</text>
<path d="M 335 574 L 335 610 L 140 610" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<circle cx="250" cy="610" r="10" fill="#bc4c00"/>
<text x="250" y="614.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">3</text>
<text x="30" y="650" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">① ② SP に 1 ずつ足しながら、下位($02)、上位($03)の順に取り出し、$0302 を作る。</text>
<text x="30" y="672" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">③ 1 を足した $0303 を PC に入れる。$0303 は、JSR の次の命令の番地。</text>
</svg>
