<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="t d">
<title id="t">スタック(PHA と PLA)</title>
<desc id="d">PHA が SP の指す番地に A を書いて SP を 1 減らし、PLA が SP を 1 増やして A に読むこと。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bc4c00"/></marker></defs>
<rect x="0.5" y="0.5" width="719" height="559" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="30" y="32" font-size="16" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">スタック(PHA と PLA)</text>
<text x="690" y="32" font-size="16" font-weight="bold" text-anchor="end" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"></text>
<text x="30" y="74" font-size="16" font-weight="bold" text-anchor="start" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PHA</text>
<text x="545" y="80" font-size="11" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">スタック(メモリ)</text>
<rect x="470" y="92.0" width="72" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="542" y="92.0" width="60" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="506.0" y="111.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$01FE</text>
<text x="572.0" y="111.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">..</text>
<rect x="470" y="128.0" width="72" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<rect x="542" y="128.0" width="60" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="506.0" y="147.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$01FD</text>
<text x="572.0" y="147.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$42</text>
<rect x="470" y="164.0" width="72" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="542" y="164.0" width="60" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="506.0" y="183.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$01FC</text>
<text x="572.0" y="183.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">..</text>
<rect x="30" y="125.0" width="110" height="34" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
<text x="40" y="147.0" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">A</text>
<text x="130" y="147.0" font-size="14" font-weight="bold" text-anchor="end" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$42</text>
<rect x="30" y="183.0" width="140" height="34" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<text x="40" y="205.0" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">SP</text>
<text x="160" y="205.0" font-size="14" font-weight="bold" text-anchor="end" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$FD → $FC</text>
<path d="M 140 142 L 470 142" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="300" cy="142" r="10" fill="#0969da"/>
<text x="300" y="146.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">1</text>
<path d="M 170 200 L 310 200 L 310 178 L 470 178" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<circle cx="240" cy="200" r="10" fill="#bc4c00"/>
<text x="240" y="204.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">2</text>
<text x="30" y="236" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">① SP が指す番地 $01FD(= $0100 + $FD)に、A の値 $42 を書く。</text>
<text x="30" y="258" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">② SP から 1 を引く。SP は $FD から $FC になり、次の書き込みは $01FC になる。</text>
<text x="30" y="314" font-size="16" font-weight="bold" text-anchor="start" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">PLA</text>
<text x="545" y="320" font-size="11" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">スタック(メモリ)</text>
<rect x="470" y="332.0" width="72" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="542" y="332.0" width="60" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="506.0" y="351.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$01FE</text>
<text x="572.0" y="351.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">..</text>
<rect x="470" y="368.0" width="72" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<rect x="542" y="368.0" width="60" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="506.0" y="387.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$01FD</text>
<text x="572.0" y="387.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$42</text>
<rect x="470" y="404.0" width="72" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="542" y="404.0" width="60" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="506.0" y="423.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$01FC</text>
<text x="572.0" y="423.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">..</text>
<rect x="30" y="365.0" width="110" height="34" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<text x="40" y="387.0" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">A</text>
<text x="130" y="387.0" font-size="14" font-weight="bold" text-anchor="end" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$42</text>
<rect x="30" y="423.0" width="140" height="34" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<text x="40" y="445.0" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">SP</text>
<text x="160" y="445.0" font-size="14" font-weight="bold" text-anchor="end" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$FC → $FD</text>
<path d="M 170 440 L 310 440 L 310 418 L 470 418" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="240" cy="440" r="10" fill="#0969da"/>
<text x="240" y="444.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">1</text>
<path d="M 470 382 L 140 382" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<circle cx="300" cy="382" r="10" fill="#bc4c00"/>
<text x="300" y="386.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">2</text>
<text x="30" y="476" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">① SP に 1 を足す。SP は $FC から $FD になる。</text>
<text x="30" y="498" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">② SP が指す番地 $01FD の内容 $42 を読んで、A に入れる。</text>
</svg>
