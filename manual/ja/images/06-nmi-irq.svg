<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="t d">
<title id="t">NMI と IRQ の違い</title>
<desc id="d">NMI がエッジで 1 回、IRQ がレベルで、要因が消えるまで繰り返し受け付けられること。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bc4c00"/></marker></defs>
<rect x="0.5" y="0.5" width="719" height="499" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="30" y="32" font-size="16" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">NMI と IRQ の違い</text>
<text x="690" y="32" font-size="16" font-weight="bold" text-anchor="end" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"></text>
<text x="30" y="146" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">NMI</text>
<text x="30" y="166" font-size="11" font-weight="normal" text-anchor="start" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">(要求の線)</text>
<path d="M 190 160 L 250 160 L 250 120 L 420 120 L 420 160 L 500 160 L 500 120 L 590 120 L 590 160 L 690 160" fill="none" stroke="#1f2328" stroke-width="2"/>
<text x="182" y="124" font-size="11" font-weight="normal" text-anchor="end" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">あり</text>
<text x="182" y="164" font-size="11" font-weight="normal" text-anchor="end" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">なし</text>
<path d="M 250 90 L 250 120" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<path d="M 500 90 L 500 120" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<text x="250" y="80" font-size="11" font-weight="normal" text-anchor="middle" fill="#bc4c00" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">受け付け</text>
<text x="500" y="80" font-size="11" font-weight="normal" text-anchor="middle" fill="#bc4c00" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">受け付け</text>
<text x="30" y="196" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">要求が「なし」から「あり」に変わった 1 回ごとに、1 回だけ受け付ける。I フラグには関係しない。</text>
<text x="30" y="286" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">IRQ</text>
<text x="30" y="306" font-size="11" font-weight="normal" text-anchor="start" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">(要因を消さない)</text>
<path d="M 190 300 L 250 300 L 250 260 L 690 260" fill="none" stroke="#1f2328" stroke-width="2"/>
<text x="182" y="264" font-size="11" font-weight="normal" text-anchor="end" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">あり</text>
<text x="182" y="304" font-size="11" font-weight="normal" text-anchor="end" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">なし</text>
<path d="M 270 230 L 270 260" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<path d="M 350 230 L 350 260" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<path d="M 430 230 L 430 260" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<path d="M 510 230 L 510 260" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<path d="M 590 230 L 590 260" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<path d="M 670 230 L 670 260" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<text x="30" y="336" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">要求が「あり」の間、RTI のあとすぐに、何度でも受け付ける(I = 0 のとき)。</text>
<text x="30" y="416" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">IRQ</text>
<text x="30" y="436" font-size="11" font-weight="normal" text-anchor="start" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">(ハンドラが要因を消す)</text>
<path d="M 190 430 L 250 430 L 250 390 L 300 390 L 300 430 L 690 430" fill="none" stroke="#1f2328" stroke-width="2"/>
<text x="182" y="394" font-size="11" font-weight="normal" text-anchor="end" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">あり</text>
<text x="182" y="434" font-size="11" font-weight="normal" text-anchor="end" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">なし</text>
<path d="M 270 360 L 270 390" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<text x="318" y="414" font-size="11" font-weight="normal" text-anchor="start" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">$A001 を読んで、要求を下げる</text>
<text x="30" y="466" font-size="12" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">ハンドラが要因を消せば、受け付けは 1 回で終わる。</text>
</svg>
