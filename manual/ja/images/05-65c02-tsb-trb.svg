<text x="30" y="326" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">TRB: M AND NOT A</text>
<text x="590" y="276" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$3F</text>
<text x="590" y="326" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$03</text>
<text x="30" y="370" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">A = $3C と M = $0F を AND する。結果 $0C は捨てて、0 かどうかだけを Z に入れる。</text>
<text x="30" y="392" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">TSB は、A の 1 のビットを、メモリで 1 にする。M は $3F になる。</text>
<text x="30" y="414" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">TRB は、A の 1 のビットを、メモリで 0 にする。M は $03 になる(元の M から別に求めた値)。</text>
<text x="30" y="436" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">A と、Z 以外のフラグは変わらない。</text>
