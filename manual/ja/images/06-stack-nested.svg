<text x="30" y="330" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">$01FD と $01FC は、最初の JSR が積んだ戻り番地($0302)。上位が先、下位が次。</text>
<text x="30" y="352" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">$01FB と $01FA は、2 つ目の JSR が積んだ戻り番地($0322)。SP は 2 つずつ下がる。</text>
<text x="30" y="374" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">RTS は、SP を戻して番地を取り出す。取り出した値は、メモリに残るが、次の PHA や JSR で上書きされる。</text>
</svg>
