<text x="494" y="86" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">③ RTS で 1 つ戻ったあと</text>
<text x="494" y="106" font-size="13" font-weight="bold" text-anchor="start" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SP = $FB</text>
