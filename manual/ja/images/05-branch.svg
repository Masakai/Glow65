<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-labelledby="t d">
<title id="t">分岐の飛び先</title>
<desc id="d">分岐命令の距離は、次の命令の番地から測ること。前へも後ろへも分岐できること。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bc4c00"/></marker></defs>
<rect x="0.5" y="0.5" width="719" height="309" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="30" y="32" font-size="16" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">分岐の飛び先</text>
<text x="690" y="32" font-size="16" font-weight="bold" text-anchor="end" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"></text>
<text x="30" y="64" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">前へ分岐(距離 +2)</text>
<rect x="30" y="85" width="64" height="30" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<rect x="94" y="85" width="84" height="30" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<rect x="178" y="85" width="112" height="30" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="62" y="105" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$0302</text>
<text x="136" y="105" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">D0 02</text>
<text x="234" y="105" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">BNE $0306</text>
<rect x="30" y="123" width="64" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="94" y="123" width="84" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="178" y="123" width="112" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="62" y="143" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$0304</text>
<text x="136" y="143" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">A9 EE</text>
<text x="234" y="143" font-size="13" font-weight="bold" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">LDA #$EE</text>
<rect x="30" y="161" width="64" height="30" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<rect x="94" y="161" width="84" height="30" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<rect x="178" y="161" width="112" height="30" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<text x="62" y="181" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$0306</text>
<text x="136" y="181" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">8D F0 03</text>
<text x="234" y="181" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STA $03F0</text>
<path d="M 290 100 L 314 100 L 314 176 L 290 176" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<circle cx="314" cy="138.0" r="10" fill="#bc4c00"/>
<text x="314" y="142.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">1</text>
<text x="30" y="210" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">次の命令 $0304 + $02 = $0306</text>
<text x="380" y="64" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">後ろへ分岐(距離 −3)</text>
<rect x="380" y="85" width="64" height="30" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<rect x="444" y="85" width="84" height="30" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<rect x="528" y="85" width="112" height="30" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<text x="412" y="105" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$0302</text>
<text x="486" y="105" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">CA</text>
<text x="584" y="105" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DEX</text>
<rect x="380" y="123" width="64" height="30" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<rect x="444" y="123" width="84" height="30" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<rect x="528" y="123" width="112" height="30" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="412" y="143" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$0303</text>
<text x="486" y="143" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">D0 FD</text>
<text x="584" y="143" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">BNE $0302</text>
<rect x="380" y="161" width="64" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="444" y="161" width="84" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="528" y="161" width="112" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="412" y="181" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$0305</text>
<text x="486" y="181" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">8E F0 03</text>
<text x="584" y="181" font-size="13" font-weight="bold" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">STX $03F0</text>
<path d="M 640 138 L 664 138 L 664 100 L 640 100" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<circle cx="664" cy="119.0" r="10" fill="#bc4c00"/>
<text x="664" y="123.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">1</text>
<text x="380" y="210" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">次の命令 $0305 + $FD(−3) = $0302</text>
<text x="30" y="250" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">距離は、分岐命令の次の命令の番地から測る。$FD は、符号付きの 8 ビットで −3。</text>
<text x="30" y="272" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">条件が成り立たないとき、PC は次の命令に進む。成り立つときだけ、PC に距離を足す。</text>
</svg>
