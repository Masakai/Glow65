<svg xmlns="http://www.w3.org/2000/svg" width="720" height="476" viewBox="0 0 720 476" role="img" aria-labelledby="t d">
<title id="t">BBR のオペコードとビット</title>
<desc id="d">BBR3 で、オペコードのビット 4〜6 が調べるビットを表し、ゼロページの値のそのビットが 0 なら分岐すること。</desc>
