<text x="404" y="342" font-size="12" font-weight="normal" text-anchor="middle" fill="#0969da" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">ビット 3 = 0</text>
<text x="30" y="380" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">① オペコード $3F は BBR。ビット 4〜6(%011)が、調べるビット 3 を表す。</text>
<text x="30" y="402" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">② ゼロページ $10 の値 $24 を読み、ビット 3 を調べる。ビット 3 は 0。</text>
<text x="30" y="424" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">③ BBR は 0 のとき分岐する。次の命令の番地 $0303 に距離 $05 を足して、$0308 へ飛ぶ。</text>
<text x="30" y="446" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">BBS は、ビットが 1 のとき分岐する。フラグは変わらない。</text>
