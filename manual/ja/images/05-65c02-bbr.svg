<text x="212" y="212" font-size="12" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">0 = BBR</text>
<text x="308" y="212" font-size="12" font-weight="normal" text-anchor="middle" fill="#bc4c00" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">n = 3(調べるビット)</text>
<text x="30" y="256" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">ゼロページ $0010 の値 $24</text>
<text x="212" y="282" font-size="11" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif">b7</text>
