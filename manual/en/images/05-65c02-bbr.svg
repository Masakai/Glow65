<text x="212" y="212" font-size="12" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">0 = BBR</text>
<text x="308" y="212" font-size="12" font-weight="normal" text-anchor="middle" fill="#bc4c00" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">n = 3 (the bit to test)</text>
<text x="30" y="256" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">Value $24 at zero page $0010</text>
<text x="212" y="282" font-size="11" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">b7</text>
