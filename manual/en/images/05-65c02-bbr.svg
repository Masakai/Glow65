<text x="404" y="342" font-size="12" font-weight="normal" text-anchor="middle" fill="#0969da" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">Bit 3 = 0</text>
<text x="30" y="380" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">① Opcode $3F is BBR. Bits 4 to 6 (%011) give the bit to test, bit 3.</text>
<text x="30" y="402" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">② Read the value $24 at zero page $10 and test bit 3. Bit 3 is 0.</text>
<text x="30" y="424" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">③ BBR branches when the bit is 0. It adds the offset $05 to the next address $0303 and jumps to $0308.</text>
<text x="30" y="446" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">BBS branches when the bit is 1. No flags change.</text>
</svg>
