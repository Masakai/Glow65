<rect x="430" y="288" width="44" height="34" rx="4" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.2"/>
<text x="452.0" y="310.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1</text>
