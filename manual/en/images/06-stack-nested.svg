<text x="529.0" y="275.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$01F9</text>
<text x="590.0" y="275.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">..</text>
<text x="30" y="330" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">$01FD and $01FC hold the return address ($0302) pushed by the first JSR: high byte first, then low byte.</text>
<text x="30" y="352" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">$01FB and $01FA hold the return address ($0322) pushed by the second JSR. SP drops by 2 each time.</text>
<text x="30" y="374" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">RTS moves SP back and pulls the address. The pulled values stay in memory</text>
<text x="52" y="396" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">until a later PHA or JSR overwrites them.</text>
</svg>
