<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-labelledby="t d">
<title id="t">The 8 bits of the P register</title>
<desc id="d">Bit positions and meanings of N, V, B, D, I, Z and C. How the value of P differs after reset, when pushed by PHP and BRK, and when pushed by IRQ and NMI.</desc>
