<rect x="330" y="250" width="132" height="52" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.6"/>
<text x="396.0" y="272.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$0600 + Y($03)</text>
<text x="396.0" y="290.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">= $0603</text>
