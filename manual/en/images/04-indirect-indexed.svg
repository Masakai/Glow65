<circle cx="235" cy="276" r="10" fill="#0969da"/>
<text x="235" y="280.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">4</text>
<rect x="520" y="262.0" width="72" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<rect x="592" y="262.0" width="60" height="28" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="556.0" y="281.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$0603</text>
<text x="622.0" y="281.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$9D</text>
<path d="M 462 276.0 L 520 276" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="491" cy="276" r="10" fill="#0969da"/>
<text x="491" y="280.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">5</text>
<rect x="30" y="318.0" width="110" height="34" rx="4" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
<text x="40" y="340.0" font-size="14" font-weight="bold" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">A</text>
<text x="130" y="340.0" font-size="14" font-weight="bold" text-anchor="end" fill="#bc4c00" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$9D</text>
<path d="M 652 276 L 685 276 L 685 335 L 140 335" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#ao)"/>
<circle cx="685" cy="305" r="10" fill="#bc4c00"/>
<text x="685" y="309.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">6</text>
<text x="30" y="385" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">① Read opcode $B1 (LDA) and operand $30.</text>
<text x="30" y="407" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">② Read $00 at $0030 as the low byte and $06 at $0031 as the high byte to get base address $0600.</text>
<text x="30" y="429" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">③④ Add the value $03 of Y to the base address to get effective address $0603.</text>
<text x="30" y="451" font-size="13" font-weight="normal" text-anchor="start" fill="#1f2328" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">⑤⑥ Read the contents $9D of $0603 and put it in A.</text>
